# ---------------------------------------------------------------------------
# review_notes — đề xuất thay đổi so với khung gốc, CẦN CHỦ DỰ ÁN DUYỆT trước
# khi bắt đầu viết bài. Không tự áp dụng thay đổi khác ngoài những gì đã nằm
# sẵn trong "domains" ở trên (tức là các đề xuất dưới đây ĐÃ được áp dụng vào
# cấu trúc trên, ghi lại ở đây chỉ để chủ dự án biết đã lệch so với khung gốc
# chỗ nào và tại sao — có thể yêu cầu đổi lại).
# ---------------------------------------------------------------------------
review_notes:
  - "Bổ sung: mỗi mục trong khung gốc (ví dụ 'DNS', 'VLAN'...) được coi là 1 MODULE,
     tách thành nhiều BÀI nhỏ theo trình tự học — khung gốc liệt kê module, chưa tới
     mức bài, nên đã tự thêm bước phân rã này."
  - "Bổ sung bài 'IPv6 cơ bản' vào module networking.tcpip — khung gốc không có,
     nhưng cần thiết vì một số hạ tầng hiện đại (K8s, cloud) đã chạy dual-stack."
  - "Không tạo module 'networking' riêng lặp lại trong Linux — domain Linux chỉ có 1
     module 'network-stack' chứa đúng phần Linux-specific (ip/ss/iptables/tcpdump),
     các bài này trỏ prerequisite sang domain networking để tránh dạy trùng khái
     niệm TCP/IP ở cả hai nơi."
  - "Gộp 'Docker Compose' làm 1 bài trong module docker-internals thay vì tách
     module riêng — khung gốc không nêu rõ Compose, nhưng rất thực dụng cho SE khi
     chạy app nhiều container trên 1 máy, không cần K8s."
  - "Hạ độ ưu tiên xuống 'thấp' cho: Ceph (2 bài), vPC nâng cao, ACL/xattr, Splunk,
     khung tuân thủ, Helm chart authoring — đây là các mảng chuyên sâu/công cụ ít
     phổ biến hơn trong môi trường nội bộ quy mô nhỏ (theo đúng mô tả SE Dojo ở
     CLAUDE.md: 4-10 người, không phải mọi tool đều được dùng). ĐỀ XUẤT CÓ THỂ BỎ
     HẲN nếu team không dùng Ceph/Splunk — giữ tạm trong taxonomy vì vẫn là kiến
