# Khung tri thức SE Dojo — lĩnh vực > module > bài
#
# Đây là bản DRAFT giai đoạn 0, chờ duyệt trước khi viết bài. Không tự thêm bài
# vào kho tri thức nếu chưa cập nhật file này và được duyệt trước (xem review_notes
# ở cuối file để biết các đề xuất thêm/bớt so với khung gốc do chủ dự án đưa ra).
#
# Quy ước id: <domain>.<module-slug>.<lesson-slug>, toàn bộ kebab-case, không dấu,
# duy nhất toàn file. "prerequisites" tham chiếu id bài học (lesson), có thể trỏ
# sang domain khác (phụ thuộc chéo lĩnh vực là bình thường, ví dụ K8s cần Linux
# namespace/cgroup trước).
#
# level: "nền tảng" | "vận hành" | "chuyên sâu" (đúng 3 giá trị theo yêu cầu).
# priority: "cao" | "trung bình" | "thấp" — độ ưu tiên viết bài, dùng để quyết định
#   thứ tự làm giữa các module (làm "cao" trước, "thấp" có thể để sau/bỏ qua nếu
#   hết thời gian). Không phải độ khó — độ khó đã nằm ở "level".

version: 1
updated: "2026-10-05"
status: draft-awaiting-review

domains:
  - id: linux
    title: "Linux"
    modules:
      - id: linux.boot-systemd
        title: "Boot và systemd"
        lessons:
          - id: linux.boot-systemd.boot-process
            title: "Quy trình boot: firmware → bootloader (GRUB) → kernel → init"
            level: "nền tảng"
            prerequisites: []
            priority: "cao"
          - id: linux.boot-systemd.units
            title: "systemd: unit, service, target cơ bản"
            level: "nền tảng"
            prerequisites: ["linux.boot-systemd.boot-process"]
            priority: "cao"
          - id: linux.boot-systemd.service-mgmt
            title: "Quản lý service với systemctl (start/stop/enable/status)"
            level: "vận hành"
            prerequisites: ["linux.boot-systemd.units"]
            priority: "cao"
          - id: linux.boot-systemd.timers
            title: "systemd timer và cron: lập lịch tác vụ"
            level: "vận hành"
            prerequisites: ["linux.boot-systemd.units"]
            priority: "trung bình"
          - id: linux.boot-systemd.advanced
            title: "systemd nâng cao: dependency (After/Requires), target, socket activation, cấu hình journald"
            level: "chuyên sâu"
            prerequisites: ["linux.boot-systemd.service-mgmt"]
            priority: "trung bình"

      - id: linux.process-signals
        title: "Process và tín hiệu"
        lessons:
          - id: linux.process-signals.lifecycle
            title: "Vòng đời process: fork/exec, PPID, các trạng thái process"
            level: "nền tảng"
            prerequisites: []
            priority: "cao"
          - id: linux.process-signals.signals
            title: "Tín hiệu Unix: SIGTERM/SIGKILL/SIGHUP và graceful shutdown"
            level: "nền tảng"
            prerequisites: ["linux.process-signals.lifecycle"]
            priority: "cao"
          - id: linux.process-signals.job-control
            title: "Job control: foreground/background, nohup, disown"
            level: "vận hành"
            prerequisites: ["linux.process-signals.lifecycle"]
            priority: "trung bình"
          - id: linux.process-signals.monitoring
            title: "Giám sát process: ps, top, htop, đọc load/CPU/MEM"
            level: "vận hành"
            prerequisites: ["linux.process-signals.lifecycle"]
            priority: "cao"
          - id: linux.process-signals.zombie-orphan
            title: "Chẩn đoán zombie/orphan process và process leak"
            level: "chuyên sâu"
            prerequisites: ["linux.process-signals.signals", "linux.process-signals.monitoring"]
            priority: "trung bình"

      - id: linux.filesystem-storage
        title: "Filesystem, LVM, RAID"
        lessons:
          - id: linux.filesystem-storage.fhs-permissions
            title: "Filesystem Hierarchy Standard (FHS) và permission cơ bản"
            level: "nền tảng"
            prerequisites: []
            priority: "cao"
          - id: linux.filesystem-storage.partitioning
            title: "Phân vùng đĩa: fdisk/parted, GPT vs MBR"
            level: "vận hành"
            prerequisites: ["linux.filesystem-storage.fhs-permissions"]
            priority: "cao"
          - id: linux.filesystem-storage.lvm-basics
            title: "LVM cơ bản: Physical/Volume/Logical Volume, tạo và mount filesystem mới"
            level: "vận hành"
            prerequisites: ["linux.filesystem-storage.partitioning"]
            priority: "cao"
          - id: linux.filesystem-storage.lvm-advanced
            title: "LVM nâng cao: resize, snapshot, thin provisioning"
            level: "chuyên sâu"
            prerequisites: ["linux.filesystem-storage.lvm-basics"]
            priority: "trung bình"
          - id: linux.filesystem-storage.raid-mdadm
            title: "RAID phần mềm với mdadm: các mức RAID phổ biến, tạo và theo dõi"
            level: "chuyên sâu"
            prerequisites: ["linux.filesystem-storage.partitioning"]
            priority: "trung bình"
          - id: linux.filesystem-storage.troubleshooting
            title: "Chẩn đoán hết dung lượng, hết inode, filesystem lỗi (fsck)"
            level: "vận hành"
            prerequisites: ["linux.filesystem-storage.fhs-permissions", "linux.filesystem-storage.partitioning"]
            priority: "cao"

      - id: linux.users-permissions
        title: "User và phân quyền"
        lessons:
          - id: linux.users-permissions.users-groups
            title: "Quản lý user/group: useradd, usermod, /etc/passwd, /etc/shadow"
            level: "nền tảng"
            prerequisites: []
            priority: "cao"
          - id: linux.users-permissions.chmod-chown
            title: "Permission và ownership: chmod, chown, umask"
            level: "nền tảng"
            prerequisites: ["linux.users-permissions.users-groups"]
            priority: "cao"
          - id: linux.users-permissions.sudo-pam
            title: "sudo và PAM cơ bản: /etc/sudoers, module xác thực"
            level: "vận hành"
            prerequisites: ["linux.users-permissions.users-groups"]
            priority: "cao"
          - id: linux.users-permissions.acl-xattr
            title: "ACL và extended attributes: quyền chi tiết hơn rwx truyền thống"
            level: "chuyên sâu"
            prerequisites: ["linux.users-permissions.chmod-chown"]
            priority: "thấp"
          - id: linux.users-permissions.selinux-apparmor
            title: "SELinux/AppArmor: enforcing/permissive, chẩn đoán bị chặn bởi MAC"
            level: "chuyên sâu"
            prerequisites: ["linux.users-permissions.chmod-chown"]
            priority: "trung bình"

      - id: linux.network-stack
        title: "Network stack trên Linux"
        lessons:
          - id: linux.network-stack.tools
            title: "Công cụ mạng trên Linux: ip addr/route, ss cơ bản"
            level: "nền tảng"
            prerequisites: ["networking.tcpip.osi-tcpip-model"]
            priority: "cao"
          - id: linux.network-stack.dns-resolution
            title: "DNS resolution trên Linux: resolv.conf, nsswitch, systemd-resolved"
            level: "vận hành"
            prerequisites: ["linux.network-stack.tools", "networking.dns.fundamentals"]
            priority: "cao"
          - id: linux.network-stack.firewall
            title: "Firewall trên Linux: iptables/nftables/firewalld/ufw cơ bản"
            level: "vận hành"
            prerequisites: ["linux.network-stack.tools"]
            priority: "cao"
          - id: linux.network-stack.troubleshooting
            title: "Chẩn đoán mạng trên Linux: tcpdump, traceroute, MTU, bonding"
            level: "chuyên sâu"
            prerequisites: ["linux.network-stack.tools", "linux.network-stack.firewall"]
            priority: "trung bình"

      - id: linux.performance
        title: "Hiệu năng (CPU, RAM, I/O)"
        lessons:
          - id: linux.performance.cpu-load
            title: "Hiệu năng CPU: load average, nice/renice, context switch"
            level: "vận hành"
            prerequisites: ["linux.process-signals.monitoring"]
            priority: "cao"
          - id: linux.performance.memory-swap
            title: "Bộ nhớ và swap: free, buffer/cache, OOM killer"
            level: "vận hành"
            prerequisites: []
            priority: "cao"
          - id: linux.performance.io
            title: "Hiệu năng I/O: iostat, vmstat, phân biệt nghẽn CPU/RAM/disk"
            level: "chuyên sâu"
            prerequisites: ["linux.performance.cpu-load", "linux.performance.memory-swap"]
            priority: "trung bình"
          - id: linux.performance.case-study
            title: "Case study troubleshooting hiệu năng tổng hợp: strace, lsof"
            level: "chuyên sâu"
            prerequisites: ["linux.performance.io"]
            priority: "trung bình"

      - id: linux.shell-scripting
        title: "Shell scripting"
        lessons:
          - id: linux.shell-scripting.bash-basics
            title: "Bash cơ bản: biến, điều kiện, vòng lặp, tham số dòng lệnh"
            level: "nền tảng"
            prerequisites: []
            priority: "cao"
          - id: linux.shell-scripting.text-processing
            title: "Xử lý văn bản: grep, sed, awk, xargs"
            level: "vận hành"
            prerequisites: ["linux.shell-scripting.bash-basics"]
            priority: "cao"
          - id: linux.shell-scripting.bash-advanced
            title: "Bash nâng cao: hàm, trap, set -e/-u, xử lý lỗi"
            level: "chuyên sâu"
            prerequisites: ["linux.shell-scripting.bash-basics", "linux.shell-scripting.text-processing"]
            priority: "trung bình"
          - id: linux.shell-scripting.best-practices
            title: "Best practice viết script vận hành: idempotent, logging, exit code"
            level: "chuyên sâu"
            prerequisites: ["linux.shell-scripting.bash-advanced"]
            priority: "trung bình"

      - id: linux.package-management
        title: "Quản lý gói"
        lessons:
          - id: linux.package-management.deb
            title: "Quản lý gói Debian/Ubuntu: apt, dpkg"
            level: "vận hành"
            prerequisites: []
            priority: "trung bình"
          - id: linux.package-management.rpm
            title: "Quản lý gói RHEL/CentOS: dnf/yum, rpm"
            level: "vận hành"
            prerequisites: []
            priority: "trung bình"

      - id: linux.kernel-troubleshooting
        title: "Kernel và troubleshooting"
        lessons:
          - id: linux.kernel-troubleshooting.modules
            title: "Kernel module: lsmod, modprobe, /proc, /sys"
            level: "chuyên sâu"
            prerequisites: []
            priority: "trung bình"
          - id: linux.kernel-troubleshooting.sysctl
            title: "Tuning kernel qua sysctl: tham số mạng và bộ nhớ phổ biến"
            level: "chuyên sâu"
            prerequisites: ["linux.kernel-troubleshooting.modules"]
            priority: "trung bình"
          - id: linux.kernel-troubleshooting.kernel-logs
            title: "Đọc log kernel: dmesg, journalctl -k, nhận diện lỗi phần cứng/driver"
            level: "vận hành"
            prerequisites: ["linux.kernel-troubleshooting.modules"]
            priority: "trung bình"
          - id: linux.kernel-troubleshooting.methodology
            title: "Phương pháp luận troubleshooting Linux tổng hợp (bài capstone)"
            level: "chuyên sâu"
            prerequisites:
              - "linux.performance.case-study"
              - "linux.filesystem-storage.troubleshooting"
              - "linux.network-stack.troubleshooting"
              - "linux.kernel-troubleshooting.kernel-logs"
            priority: "cao"

  - id: networking
    title: "Networking"
    modules:
      - id: networking.tcpip
        title: "Mô hình TCP/IP"
        lessons:
          - id: networking.tcpip.osi-tcpip-model
            title: "Mô hình OSI và TCP/IP: các tầng và vai trò"
            level: "nền tảng"
            prerequisites: []
            priority: "cao"
          - id: networking.tcpip.ipv4-subnetting
            title: "Địa chỉ IPv4 và subnetting (CIDR)"
            level: "nền tảng"
            prerequisites: ["networking.tcpip.osi-tcpip-model"]
            priority: "cao"
          - id: networking.tcpip.ipv6-basics
            title: "IPv6 cơ bản: định dạng địa chỉ, khác biệt chính với IPv4"
            level: "vận hành"
            prerequisites: ["networking.tcpip.ipv4-subnetting"]
            priority: "trung bình"
          - id: networking.tcpip.tcp-udp
            title: "TCP vs UDP: handshake, cửa sổ trượt, khi nào dùng loại nào"
            level: "nền tảng"
            prerequisites: ["networking.tcpip.osi-tcpip-model"]
            priority: "cao"

      - id: networking.switching
        title: "Switching (VLAN, STP, LACP, vPC)"
        lessons:
          - id: networking.switching.basics
            title: "Switching cơ bản: MAC table, broadcast domain, collision domain"
            level: "nền tảng"
            prerequisites: ["networking.tcpip.osi-tcpip-model"]
            priority: "cao"
          - id: networking.switching.vlan
            title: "VLAN: trunk, access port, 802.1Q tagging"
            level: "vận hành"
            prerequisites: ["networking.switching.basics"]
            priority: "cao"
          - id: networking.switching.stp
            title: "Spanning Tree Protocol: ngăn loop, root bridge, port state"
            level: "vận hành"
            prerequisites: ["networking.switching.vlan"]
            priority: "trung bình"
          - id: networking.switching.lacp
            title: "LACP/port-channel: gộp link tăng băng thông và dự phòng"
            level: "vận hành"
            prerequisites: ["networking.switching.vlan"]
            priority: "trung bình"
          - id: networking.switching.vpc-advanced
            title: "vPC và high-availability switching nâng cao"
            level: "chuyên sâu"
            prerequisites: ["networking.switching.lacp"]
            priority: "thấp"

      - id: networking.routing
        title: "Routing (static, OSPF, BGP)"
        lessons:
          - id: networking.routing.static
            title: "Routing tĩnh: routing table, default gateway, longest prefix match"
            level: "nền tảng"
            prerequisites: ["networking.tcpip.ipv4-subnetting"]
            priority: "cao"
          - id: networking.routing.ospf
            title: "OSPF cơ bản: area, cost, DR/BDR"
            level: "vận hành"
            prerequisites: ["networking.routing.static"]
            priority: "trung bình"
          - id: networking.routing.bgp
            title: "BGP cơ bản: AS, eBGP/iBGP, path selection"
            level: "chuyên sâu"
            prerequisites: ["networking.routing.ospf"]
            priority: "trung bình"

      - id: networking.dns
        title: "DNS"
        lessons:
          - id: networking.dns.fundamentals
            title: "DNS: hierarchy, resource record, resolver vs authoritative"
            level: "nền tảng"
            prerequisites: ["networking.tcpip.osi-tcpip-model"]
            priority: "cao"
          - id: networking.dns.operations
            title: "Vận hành DNS: zone file, TTL, caching, troubleshooting (dig/nslookup)"
            level: "vận hành"
            prerequisites: ["networking.dns.fundamentals"]
            priority: "cao"

      - id: networking.dhcp
        title: "DHCP"
        lessons:
          - id: networking.dhcp.fundamentals
            title: "DHCP: DORA process, lease, relay"
            level: "vận hành"
            prerequisites: ["networking.tcpip.ipv4-subnetting"]
            priority: "cao"

      - id: networking.nat-firewall
        title: "NAT và firewall"
        lessons:
          - id: networking.nat-firewall.nat-types
            title: "NAT: static, dynamic, PAT/masquerade"
            level: "vận hành"
            prerequisites: ["networking.tcpip.ipv4-subnetting"]
            priority: "cao"
          - id: networking.nat-firewall.firewall-concepts
            title: "Firewall: stateful vs stateless, zone, thứ tự rule"
            level: "vận hành"
            prerequisites: ["networking.nat-firewall.nat-types"]
            priority: "cao"
          - id: networking.nat-firewall.acl-security-groups
            title: "ACL và security group trên thiết bị mạng/cloud"
            level: "vận hành"
            prerequisites: ["networking.nat-firewall.firewall-concepts"]
            priority: "trung bình"

      - id: networking.tls-pki
        title: "TLS và PKI"
        lessons:
          - id: networking.tls-pki.handshake
            title: "TLS: handshake, cipher suite, chứng chỉ"
            level: "vận hành"
            prerequisites: []
            priority: "cao"
          - id: networking.tls-pki.pki-cert-mgmt
            title: "PKI: CA, chuỗi chứng chỉ, quản lý và gia hạn cert"
            level: "vận hành"
            prerequisites: ["networking.tls-pki.handshake"]
            priority: "trung bình"
          - id: networking.tls-pki.troubleshooting
            title: "Chẩn đoán lỗi TLS/SSL thường gặp (expired cert, chain, SNI)"
            level: "vận hành"
            prerequisites: ["networking.tls-pki.pki-cert-mgmt"]
            priority: "trung bình"

      - id: networking.http-lb
        title: "HTTP và load balancing"
        lessons:
          - id: networking.http-lb.http-fundamentals
            title: "HTTP/HTTPS: method, status code, header quan trọng"
            level: "nền tảng"
            prerequisites: []
            priority: "cao"
          - id: networking.http-lb.reverse-proxy
            title: "Reverse proxy: Nginx/HAProxy cơ bản"
            level: "vận hành"
            prerequisites: ["networking.http-lb.http-fundamentals"]
            priority: "cao"
          - id: networking.http-lb.lb-algorithms
            title: "Thuật toán load balancing và health check"
            level: "vận hành"
            prerequisites: ["networking.http-lb.reverse-proxy"]
            priority: "trung bình"

      - id: networking.vpn
        title: "VPN"
        lessons:
          - id: networking.vpn.types
            title: "VPN: site-to-site vs remote access, IPsec vs SSL VPN cơ bản"
            level: "vận hành"
            prerequisites: ["networking.tls-pki.handshake"]
            priority: "trung bình"

      - id: networking.diagnostic-tools
        title: "Công cụ chẩn đoán (tcpdump, mtr, ss)"
        lessons:
          - id: networking.diagnostic-tools.tcpdump-wireshark
            title: "Bắt và đọc gói tin: tcpdump, Wireshark cơ bản"
            level: "vận hành"
            prerequisites: ["networking.tcpip.tcp-udp"]
            priority: "cao"
          - id: networking.diagnostic-tools.mtr-traceroute
            title: "mtr/traceroute: chẩn đoán đường đi và mất gói"
            level: "vận hành"
            prerequisites: ["networking.diagnostic-tools.tcpdump-wireshark"]
            priority: "cao"
          - id: networking.diagnostic-tools.ss-netstat
            title: "ss/netstat: kiểm tra socket, cổng đang nghe/kết nối"
            level: "vận hành"
            prerequisites: []
            priority: "cao"

  - id: virt-storage
    title: "Ảo hóa và lưu trữ"
    modules:
      - id: virt-storage.vsphere
        title: "VMware vSphere"
        lessons:
          - id: virt-storage.vsphere.architecture
            title: "Kiến trúc vSphere: ESXi, vCenter, cluster"
            level: "nền tảng"
            prerequisites: []
            priority: "cao"
          - id: virt-storage.vsphere.vm-lifecycle
            title: "Quản lý VM: tạo, clone, snapshot, migrate (vMotion)"
            level: "vận hành"
            prerequisites: ["virt-storage.vsphere.architecture"]
            priority: "cao"
          - id: virt-storage.vsphere.networking-storage
            title: "Networking (vSwitch/port group) và storage (datastore) cho VM"
            level: "vận hành"
            prerequisites: ["virt-storage.vsphere.vm-lifecycle"]
            priority: "trung bình"
          - id: virt-storage.vsphere.ha-drs
            title: "HA và DRS: tự động chịu lỗi và cân bằng tải cluster"
            level: "chuyên sâu"
            prerequisites: ["virt-storage.vsphere.vm-lifecycle"]
            priority: "trung bình"

      - id: virt-storage.proxmox-kvm
        title: "Proxmox/KVM"
        lessons:
          - id: virt-storage.proxmox-kvm.fundamentals
            title: "KVM/QEMU cơ bản: ảo hóa dựa trên Linux kernel"
            level: "nền tảng"
            prerequisites: []
            priority: "trung bình"
          - id: virt-storage.proxmox-kvm.cluster
            title: "Proxmox VE: quản lý cluster, VM và container (LXC)"
            level: "vận hành"
            prerequisites: ["virt-storage.proxmox-kvm.fundamentals"]
            priority: "trung bình"

      - id: virt-storage.san-nas
        title: "SAN, NAS, iSCSI, NFS"
        lessons:
          - id: virt-storage.san-nas.fundamentals
            title: "Khái niệm storage: block vs file vs object"
            level: "nền tảng"
            prerequisites: []
            priority: "cao"
          - id: virt-storage.san-nas.iscsi
            title: "iSCSI: target/initiator, LUN, kết nối SAN qua IP"
            level: "vận hành"
            prerequisites: ["virt-storage.san-nas.fundamentals"]
            priority: "trung bình"
          - id: virt-storage.san-nas.nfs
            title: "NFS: export, mount, quyền và troubleshooting phổ biến"
            level: "vận hành"
            prerequisites: ["virt-storage.san-nas.fundamentals"]
            priority: "cao"

      - id: virt-storage.ceph
        title: "Ceph"
        lessons:
          - id: virt-storage.ceph.architecture
            title: "Kiến trúc Ceph: OSD, Monitor, CRUSH map, pool"
            level: "chuyên sâu"
            prerequisites: ["virt-storage.san-nas.fundamentals"]
            priority: "thấp"
          - id: virt-storage.ceph.operations
            title: "Vận hành Ceph cơ bản: health check, xử lý OSD down"
            level: "chuyên sâu"
            prerequisites: ["virt-storage.ceph.architecture"]
            priority: "thấp"

      - id: virt-storage.backup-dr
